# Optional split topology. Engine and API stay on the official image so a
# sidecar tweak does not reload 115 GiB of weights. The sidecar is the same
# wrapped image running in standalone-proxy mode.
#
#   HALOGEN_MODELS=/path/to/weights docker compose up
#
# llama-swap should target http://127.0.0.1:8731/v1

x-halogen-devices: &halogen-devices
  devices:
    - /dev/kfd
    - /dev/dri
  security_opt: [seccomp:unconfined]
  ipc: host
  ulimits:
    memlock: -1
  group_add: [keep-groups]

services:
  engine:
    image: ${HALOGEN_IMAGE:-ghcr.io/peonist-ai/halogen-flash-server:0.17.4}
    command: ["engine"]
    environment:
      HALOGEN_BIND: 0.0.0.0
      HALOGEN_VISION_TOWER: ${HALOGEN_VISION_TOWER:-}
    volumes:
      - ${HALOGEN_MODELS:?set HALOGEN_MODELS}:/models:ro
    <<: *halogen-devices

  api:
    image: ${HALOGEN_IMAGE:-ghcr.io/peonist-ai/halogen-flash-server:0.17.4}
    command: ["api"]
    depends_on: [engine]
    environment:
      HALOGEN_ENGINE: engine:8730
    volumes:
      - ${HALOGEN_MODELS:?set HALOGEN_MODELS}:/models:ro
    # Intentionally unpublished. llama-swap talks to `sidecar`.

  sidecar:
    build:
      context: .
      args:
        HALOGEN_IMAGE: ${HALOGEN_IMAGE:-ghcr.io/peonist-ai/halogen-flash-server:0.17.4}
    environment:
      HALOGEN_SIDECAR_UPSTREAM: api:8731
      HALOGEN_SIDECAR_LISTEN: 0.0.0.0:8731
      # NOTE: in this split topology the api container runs the upstream
      # entrypoint, which does not tee its stdout anywhere this container can
      # read. So every request logs [estimate] here. The [serve_api] path is
      # only wired in the single-container wrap.sh mode. To get real counts
      # across the split, tee the api container's stdout onto a shared volume
      # and point HALOGEN_UPSTREAM_LOG at it.
      HALOGEN_UPSTREAM_LOG: /tmp/halogen-upstream.log
    ports:
      - "8731:8731"
    depends_on: [api]

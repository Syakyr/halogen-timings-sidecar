name: build

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*-sidecar[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      halogen_version:
        description: "Upstream halogen-flash-server version (e.g. 0.11.1)"
        required: true
      sidecar_number:
        description: "Sidecar build number for that Halogen version"
        required: true
        default: "1"

env:
  REGISTRY: ghcr.io

jobs:
  lint-test:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests + coverage
        id: tests
        run: |
          set -euo pipefail
          uv run pytest --cov=proxy --cov-branch \
            --cov-report=term-missing --cov-fail-under=75 2>&1 | tee pytest.log
          # Carried into the release notes so the published artifact names the
          # run that actually produced it.
          passed="$(grep -oE '[0-9]+ passed[^=]*' pytest.log | tail -1 || true)"
          cov="$(grep -E '^TOTAL' pytest.log | grep -oE '[0-9]+%' | tail -1 || true)"
          echo "summary=${passed}${cov:+, coverage ${cov}}" >> "$GITHUB_OUTPUT"

  image:
    needs: lint-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release notes
      packages: write
    steps:
      # Full history: the release notes diff our commits against the previous
      # release tag, which a default shallow checkout does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HALOGEN="${{ inputs.halogen_version }}"
            N="${{ inputs.sidecar_number }}"
          else
            TAG="${GITHUB_REF_NAME}"
            HALOGEN="${TAG%%-sidecar*}"
            N="${TAG##*-sidecar}"
          fi
          LATEST_UPSTREAM="$(
            curl -fsSL \
              https://api.github.com/repos/peonist-ai/halogen-flash-server/tags \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["name"].lstrip("v"))'
          )"
          IS_LATEST=no
          [ "$HALOGEN" = "$LATEST_UPSTREAM" ] && IS_LATEST=yes
          # GHCR namespaces must be lowercase; github.repository keeps display case.
          IMAGE="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "halogen=$HALOGEN"
            echo "sidecar=$N"
            echo "is_latest=$IS_LATEST"
            echo "image=$IMAGE"
            echo "tag=$HALOGEN-sidecar$N"
          } >> "$GITHUB_OUTPUT"
          echo "Building sidecar for halogen $HALOGEN (build #$N, latest=$IS_LATEST) -> $IMAGE"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HALOGEN_IMAGE=ghcr.io/peonist-ai/halogen-flash-server:${{ steps.ver.outputs.halogen }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.halogen }}-sidecar${{ steps.ver.outputs.sidecar }}
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.halogen }}
            ${{ steps.ver.outputs.is_latest == 'yes' && format('ghcr.io/{0}:latest', steps.ver.outputs.image) || '' }}
          cache-from: type=gha,scope=image-${{ steps.ver.outputs.halogen }}
          cache-to: type=gha,scope=image-${{ steps.ver.outputs.halogen }},mode=max

      # One release per published pairing, the ledger llama-swap-podman and
      # code-server-paseo keep: the tag names the upstream version, so the
      # release list is the history of what each image actually baked.
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          IMAGE: ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.tag }}
          HALOGEN: ${{ steps.ver.outputs.halogen }}
          SIDECAR: ${{ steps.ver.outputs.sidecar }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TESTS: ${{ needs.lint-test.outputs.tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Idempotent and non-destructive: hand-written notes are richer than
          # anything generated here, so an existing release is left alone rather
          # than overwritten on a re-run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it alone"
            exit 0
          fi

          # "What moved" is computed against the previously published release,
          # not from memory. gh api exits non-zero with no release yet, which is
          # the empty-prev case the script handles.
          PREV="$(gh api "repos/${{ github.repository }}/releases/latest" \
            --jq .tag_name 2>/dev/null || true)"

          uv run scripts/make_release_notes.py \
            --tag "$TAG" --halogen "$HALOGEN" --sidecar "$SIDECAR" \
            --image "$IMAGE" --repo "${{ github.repository }}" \
            --prev-tag "$PREV" --digest "$DIGEST" --tests "$TESTS" \
            --run-url "$RUN_URL" > "$RUNNER_TEMP/release-notes.md"

          # The watcher pushes the provenance tag before dispatching this build,
          # so the tag normally exists; when it does not (a manual dispatch for a
          # version never tagged), gh creates it at the commit CI built here.
          gh release create "$TAG" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "published release $TAG" >> "$GITHUB_STEP_SUMMARY"

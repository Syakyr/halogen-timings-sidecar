name: build

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*-sidecar[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      halogen_version:
        description: "Upstream halogen-flash-server version (e.g. 0.11.1)"
        required: true
      sidecar_number:
        description: "Sidecar build number for that Halogen version"
        required: true
        default: "1"

env:
  REGISTRY: ghcr.io

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests + coverage
        run: >
          uv run pytest --cov=proxy --cov-branch
          --cov-report=term-missing --cov-fail-under=75

  image:
    needs: lint-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HALOGEN="${{ inputs.halogen_version }}"
            N="${{ inputs.sidecar_number }}"
          else
            TAG="${GITHUB_REF_NAME}"
            HALOGEN="${TAG%%-sidecar*}"
            N="${TAG##*-sidecar}"
          fi
          LATEST_UPSTREAM="$(
            curl -fsSL \
              https://api.github.com/repos/peonist-ai/halogen-flash-server/tags \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["name"].lstrip("v"))'
          )"
          IS_LATEST=no
          [ "$HALOGEN" = "$LATEST_UPSTREAM" ] && IS_LATEST=yes
          # GHCR namespaces must be lowercase; github.repository keeps display case.
          IMAGE="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "halogen=$HALOGEN"
            echo "sidecar=$N"
            echo "is_latest=$IS_LATEST"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Building sidecar for halogen $HALOGEN (build #$N, latest=$IS_LATEST) -> $IMAGE"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HALOGEN_IMAGE=ghcr.io/peonist-ai/halogen-flash-server:${{ steps.ver.outputs.halogen }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.halogen }}-sidecar${{ steps.ver.outputs.sidecar }}
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.halogen }}
            ${{ steps.ver.outputs.is_latest == 'yes' && format('ghcr.io/{0}:latest', steps.ver.outputs.image) || '' }}
          cache-from: type=gha,scope=image-${{ steps.ver.outputs.halogen }}
          cache-to: type=gha,scope=image-${{ steps.ver.outputs.halogen }},mode=max
